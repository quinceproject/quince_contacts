<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{shop_name}</title>
<link href="{fonts_href}" rel="stylesheet" type="text/css">
<style type="text/css">
  .q-content h1, .q-content h2 { font-family: {font_heading}; font-size: 24px; line-height: 32px; font-weight: 700; color: #141414; margin: 0 0 16px; }
  .q-content h2 { font-size: 18px; line-height: 26px; }
  .q-content p { margin: 0 0 16px; }
  .q-content a { color: #141414; }
  .q-content blockquote { margin: 0 0 16px; padding: 16px 20px; background: #f7f7f6; border-left: 4px solid {color_primary}; }
  @media only screen and (max-width: 480px) {
    .q-pad { padding-left: 20px !important; padding-right: 20px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#f0f0ef">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f0f0ef">
  <tr><td align="center">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px">
      <tr><td align="center" style="padding:32px 0 24px">
        <a href="{shop_url}"><img src="{shop_logo}" alt="{shop_name}" width="180" style="display:block;border:0;width:180px;max-width:180px;height:auto"></a>
      </td></tr>
      <tr><td style="background:{color_primary};height:4px;line-height:4px;font-size:0">&nbsp;</td></tr>
      <tr><td class="q-pad q-content" style="background:#ffffff;padding:36px 40px;font-family:{font_body};font-size:15px;line-height:24px;color:#141414">
        {content}
      </td></tr>
      <tr><td class="q-pad" style="background:{color_dark};padding:24px 40px;font-family:{font_body};font-size:12px;line-height:20px;color:#b7b7b7">
        Sent by: {company}<br><br>
        You are receiving this message because you sent a question through the form at <a href="{shop_url}" style="color:{color_primary};font-weight:700;text-decoration:none">{shop_domain}</a>.
      </td></tr>
      <tr><td style="height:24px;line-height:24px;font-size:0">&nbsp;</td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
