# Ekran osób pokazywanych klientom.
#
# `_legacy_controller` wskazuje zakładkę silnika, bo moduł bez niego nie działa.
# Uprawnienia PrestaShop sprawdza więc na zakładce silnika.
quince_contacts:
  path: quince/contacts
  methods: [GET]
  defaults:
    _controller: Quince\Contacts\Controller\Admin\PeopleController::indexAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince'

quince_contacts_add:
  path: quince/contacts/add
  methods: [POST]
  defaults:
    _controller: Quince\Contacts\Controller\Admin\PeopleController::addAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince:save'

quince_contacts_save:
  path: quince/contacts/save
  methods: [POST]
  defaults:
    _controller: Quince\Contacts\Controller\Admin\PeopleController::saveAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince:save'
